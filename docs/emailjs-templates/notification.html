<div style="font-family:Arial,Helvetica,sans-serif; max-width:560px; margin:0 auto; color:#0A1B33;">
  <div style="background:#0A1B33; padding:18px 22px; border-radius:8px 8px 0 0;">
    <img src="https://worldtechconsulting.ht/assets/logo/logo.png" alt="World Tech Consulting S.A" style="height:38px; display:block;">
  </div>
  <div style="border:1px solid #E4EAF3; border-top:none; padding:22px; border-radius:0 0 8px 8px;">
    <h2 style="margin:0 0 14px; font-size:18px;">Nouveau message depuis le site</h2>
    <table style="width:100%; border-collapse:collapse; font-size:14px;">
      <tr><td style="padding:8px 0; color:#4C5C77; width:110px;">Nom</td><td style="padding:8px 0;"><strong>{{from_name}}</strong></td></tr>
      <tr><td style="padding:8px 0; color:#4C5C77;">Email</td><td style="padding:8px 0;"><a href="mailto:{{from_email}}">{{from_email}}</a></td></tr>
      <tr><td style="padding:8px 0; color:#4C5C77;">Entreprise</td><td style="padding:8px 0;">{{company}}</td></tr>
      <tr><td style="padding:8px 0; color:#4C5C77;">Sujet</td><td style="padding:8px 0;">{{subject}}</td></tr>
    </table>
    <div style="margin-top:14px; padding:14px; background:#F4F7FB; border-radius:6px; font-size:14px; line-height:1.55; white-space:pre-wrap;">{{message}}</div>
    <p style="margin:16px 0 0; font-size:12.5px; color:#4C5C77;">Répondez directement à cet email : la réponse ira à {{from_email}}.</p>
  </div>
</div>
